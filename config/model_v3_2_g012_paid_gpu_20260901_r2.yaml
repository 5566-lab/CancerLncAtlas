# This checked-in r2 contract is intentionally non-runnable.  The estimator
# review must replace both blocker values and explicitly authorize execution in
# one reviewed patch.  Launchers must reject this file before touching CUDA.
estimator_authorization:
  status: ESTIMATOR_NOT_YET_AUTHORIZED
  decision_receipt_sha256: ESTIMATOR_NOT_YET_AUTHORIZED
  selected_schedule_mode: ESTIMATOR_NOT_YET_AUTHORIZED
  runtime_estimate_status: ESTIMATOR_NOT_YET_AUTHORIZED

# Oracle PASS is only a prerequisite and explicitly does not authorize formal
# training.  Formal V2 must also bind a real equal-step G0/G1/G2 pilot, its
# <=50-hour runtime/cost projection, a fresh formal JIT budget, and the formal
# provider auto-stop margin.  The projection must itemize every future
# CPU/no-GPU and paid instance-time component; the old 123.31 CNY sum covered
# only the 3 h oracle, 6 h equal-step and 50 h formal caps and is insufficient.
# Until that complete bridge and its real receipt hashes exist, the r2 static
# validator returns typed exit 42.
formal_gate_receipts:
  schema_status: FORMAL_EQUAL_STEP_RUNTIME_BUDGET_GATE_NOT_YET_LOCKED
  required_schema: CC_HHGT_V3_2_G012_R2_FORMAL_PAID_GATE_BINDINGS_V2

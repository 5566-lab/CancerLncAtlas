  status: EXTERNAL_CODE_ARCHIVE_LOCK_REQUIRED
  required_status_after_lock: EXTERNAL_CODE_ARCHIVE_LOCK_REQUIRED
  lock_format: CC_HHGT_V3_2_G012_R2_EXTERNAL_CODE_ARCHIVE_LOCK_V1
  lock_path: ./data/CancerLncAtlas/runtime/bootstrap/v32_g012_paid_gpu_20260901_r2/CODE_ARCHIVE.LOCK.json
  root_of_trust: ARCHIVE_EXTERNAL_BOOTSTRAP_LOCK
  lock_sha256_authority: EXTERNAL_BOOTSTRAP_CONTROLLER_ENV_V32_R2_EXTERNAL_LOCK_SHA256
  lock_is_inside_code_archive: false
  archive_hash_embedded_in_archive: false
  manifest_hash_embedded_in_archive: false


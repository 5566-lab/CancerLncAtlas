    oracle_provider_auto_stop_sha256: FORMAL_EQUAL_STEP_RUNTIME_BUDGET_GATE_NOT_YET_LOCKED
    equal_step_decision_sha256: FORMAL_EQUAL_STEP_RUNTIME_BUDGET_GATE_NOT_YET_LOCKED

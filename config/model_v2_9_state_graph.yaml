extends: model_v2_cpu.yaml

project_root: ./data/CancerLncAtlas
analysis_version: CancerLncAtlas_CC-HHGT_v2.9_state_graph_2026-08
random_seed: 20260726
results_dir: results/model/cc_hhgt_v2_9_state_graph
cache_dir: results/model/cc_hhgt_v2_9_state_graph/cache
standardized_dir: results/model/cc_hhgt_v2_9_state_graph/standardized

training:
  primary_model: cc_hhgt
  device: cuda
  hidden_channels: 96
  pair_hidden_channels: 96
  num_heads: 2
  num_layers: 2
  max_edges_per_relation: 300000
  max_training_pairs_per_fold: 250000
  max_evaluation_pairs_per_cancer: 100000
  evaluation_seed: 20260726
  evaluation_sampling_policy: label_independent_deterministic
  epochs: 250
  patience: 25
  batch_size: 16384
  mixed_precision: true
  export_node_embeddings: true
  num_workers: 0

multiseed:
  enabled: true
  primary_seed: 20260726
  replicate_seeds: [20261726, 20262726]
  confidence_level: 0.95

state_graph:
  required_states:
    - EXTEND::published_score
    - stemness_rna::RNAss
    - stemness_dna::DNAss
    - stemness_rna::EREG.EXPss
  include_regex: '(?i)(extend|telomerase|rnass|dnass|ereg[._:-]?expss|stemness)'
  min_samples: 30
  min_abs_pathway_effect: 0.15
  min_abs_gene_effect: 0.20
  max_fdr: 0.05
  max_gene_edges_per_state_direction: 250
  min_gene_variance: 0.01
  max_genes_per_cancer: 25000
  candidate_strong_abs_effect: 0.20
  candidate_strong_fdr: 0.05
  candidate_weak_abs_effect: 0.12
  candidate_weak_fdr: 0.20
  candidate_top_unlabeled_per_state: 2500
  candidate_random_unlabeled_per_state: 2500
  candidate_min_detection: 0.05
  candidate_max_lncRNAs: 16000
  lnc_block_size: 256
  covariates:
    - purity
    - age_years
    - sex
    - stage
    - molecular_subtype
    - clinical_subtype
    - technical_batch
    - leukocyte_fraction
    - cell_fraction_Macrophages.M0
    - cell_fraction_Macrophages.M1
    - cell_fraction_Macrophages.M2

state_training:
  strict_pair_evidence_mask_probability: 0.50
  validation_pathway_weight: 0.65
  validation_state_weight: 0.35
  auxiliary_loss_weight: 0.35
  direction_loss_weight: 0.15
  max_training_pairs_per_fold: 150000
  unlabeled_to_positive_ratio: 4.0
  pu_prior: 0.10
  unlabeled_weight: 0.12
  weak_positive_weight: 0.35

materialization:
  observed_core_evidence_min: 0.70
  model_supported_probability_min: 0.80
  predicted_candidate_probability_min: 0.90
  predicted_candidate_max_observed_evidence: 0.35
  max_uncertainty: 0.25
  min_members: 10
  max_members: 200
  default_gmt_include: [observed_core, model_supported]
  extended_gmt_include: [observed_core, model_supported, predicted_candidate]

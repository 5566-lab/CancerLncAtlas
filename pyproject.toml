[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancerlncatlas-cc-hhgt"
version = "3.2.0"
description = "CancerLncAtlas V3.2 exact-pathway ranked-subtype CC-HHGT pilot"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "duckdb>=1.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "statsmodels>=0.14",
  "jinja2>=3.1",
  "tabulate>=0.9"
]

[project.optional-dependencies]
gnn = ["torch>=2.3", "torch-geometric>=2.6"]
test = ["pytest>=8"]

[project.scripts]
cchhgt-v32 = "cc_hhgt.v32.cli:main"

[tool.setuptools.packages.find]
include = ["cc_hhgt*"]

required:
  bulk_lnc_expression: [cancer_id, sample_id, lncrna_id, logcpm]
  bulk_gene_expression: [cancer_id, sample_id, gene_id, logcpm]
  bulk_pathway_activity: [cancer_id, sample_id, pathway_id, activity_score]
  bulk_lnc_pathway: [cancer_id, lncrna_id, pathway_id, rho_adjusted, fdr_global]
  bulk_covariates: [cancer_id, sample_id]
  dim_lncRNA: [lncrna_id, gene_symbol]
  dim_gene: [gene_id, gene_symbol]
  dim_pathway: [pathway_id, pathway_name]
  dim_cancer: [cancer_id]
  pathway_gene_member: [pathway_id, gene_symbol]
  interaction_relation: [interaction_id, lncrna_id, partner_id, partner_type, source_database]
  evidence_event: [evidence_event_id, lncrna_id, partner_id]
  interaction_pathway_support: [lncrna_id, pathway_id, support_type]
  lnc2cancer_external: [name, cancer type, methods, pubmed id]
  lncrnadisease_external: [ncRNA Symbol, Disease Name, Validated Method//Prediction Method, PubMed ID]
  rnadisease_experimental_external: [RDID, RNA Symbol, Disease Name, PMID]
  rnadisease_predicted_external: [RDID, RNA_symbol, disease_name, method_name]
  gse85011_sample_metadata: [gsm, cell_line, target_raw, is_control, processed_data_file]
optional:
  sc_lnc_pathway: [cancer_id, lncrna_id, pathway_id]
  ucell_aggregate: [patient_id, pathway_id, mean_ucell, mean_pseudotime, cancer_id]
  prism_lnc_drug: [cancer_id, lncrna_id, drug_id, fdr]
  gdsc_lnc_drug: [cancer_id, lncrna_id, drug_id, fdr]
  drug_replication: [cancer_id, lncrna_id, drug_id, replication_status]
  clinical_survival:
    any_of:
      - [cancer_id, patient_id, OS_time, OS_event]
      - [cancer_id, sample_id, days_to_death, days_to_last_follow_up, vital_status]
  patient_fold_manifest: [cancer_id, fold_id, split]
